<!DOCTYPE html>
<html>
<head>
    <title>SOC Alert Triage Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { color: #4fc3f7; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #16213e; }
        .Attack { color: #ff5252; font-weight: bold; }
        .Normal { color: #66bb6a; }
        .Critical { background: #b71c1c; padding: 3px 8px; border-radius: 4px; }
        .High { background: #e65100; padding: 3px 8px; border-radius: 4px; }
        .Medium { background: #f9a825; padding: 3px 8px; border-radius: 4px; color: #000; }
        .reasons { font-size: 0.85em; color: #aaa; }
    </style>
</head>
<body>
    <div style="background:#16213e; padding:12px 20px; margin:-20px -20px 0 -20px; display:flex; gap:20px;">
        <a href="/" style="color:#fff; background:#4fc3f7; padding:6px 12px; border-radius:6px; text-decoration:none; font-weight:bold;">📊 Static Dashboard</a>
        <a href="/live" style="color:#4fc3f7; text-decoration:none; font-weight:bold;">🧪 Own Model (Test Data)</a>
        <a href="/live-feed" style="color:#4fc3f7; text-decoration:none; font-weight:bold;">🔴 Live Feed</a>
    </div>
    <p style="color:#888; margin:8px 0 20px 0; font-size:0.9em;">You are viewing: <strong>Static Dashboard</strong> (CICIDS2017-trained model)</p>

    <h1>🛡️ SOC Alert Triage Dashboard</h1>
    <p>Live traffic analysis powered by Machine Learning</p>
    <table id="alertsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Time</th>
                <th>Status</th>
                <th>Confidence</th>
                <th>Attack Type</th>
                <th>Risk Level</th>
                <th>Top Reasons (Why?)</th>
            </tr>
        </thead>
        <tbody id="alertsBody"></tbody>
    </table>

    <script>
        fetch('/api/alerts')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('alertsBody');
                data.forEach(alert => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${alert.id}</td>
                        <td>${alert.timestamp}</td>
                        <td class="${alert.status}">${alert.status}</td>
                        <td>${alert.confidence}%</td>
                        <td>${alert.attack_type || '-'}</td>
                        <td>${alert.risk_level ? `<span class="${alert.risk_level}">${alert.risk_level}</span>` : '-'}</td>
                        <td class="reasons">${alert.top_reasons.join(', ') || '-'}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
    </script>
</body>
</html>
